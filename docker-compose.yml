services:
  auth-api:
    build:
      context: .
      dockerfile: apps/api-dotnet/Dockerfile
    expose:
      - "8080"
    restart: unless-stopped

  blog-api:
    build:
      context: .
      dockerfile: apps/blog-api-dotnet/Dockerfile
    expose:
      - "8080"
    restart: unless-stopped

  public-site:
    build:
      context: .
      dockerfile: apps/public-site-react/Dockerfile
      args:
        VITE_BLOG_API_BASE_URL: ""
        VITE_BLOG_MODE: api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - blog-api
    restart: unless-stopped

  admin-site:
    build:
      context: .
      dockerfile: apps/admin-react/Dockerfile
      args:
        VITE_AUTH_API_BASE_URL: ""
        VITE_BLOG_API_BASE_URL: ""
        VITE_DASHBOARD_API_BASE_URL: ""
        VITE_AUTH_MODE: api
        VITE_BLOG_MODE: api
        VITE_DASHBOARD_MODE: api
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - auth-api
      - blog-api
    restart: unless-stopped

  account-site:
    build:
      context: .
      dockerfile: apps/account-react/Dockerfile
      args:
        VITE_AUTH_API_BASE_URL: ""
        VITE_BLOG_API_BASE_URL: ""
        VITE_AUTH_MODE: api
        VITE_BLOG_MODE: api
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      - auth-api
      - blog-api
    restart: unless-stopped

  dashboard-site:
    build:
      context: .
      dockerfile: apps/dashboard-react/Dockerfile
      args:
        VITE_AUTH_API_BASE_URL: ""
        VITE_DASHBOARD_API_BASE_URL: ""
        VITE_AUTH_MODE: api
        VITE_DASHBOARD_MODE: api
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      - auth-api
    restart: unless-stopped
